<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confronto Fotovoltaico</title>
  <meta name="description" content="Produzione e resa degli impianti fotovoltaici a confronto">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='5' fill='%23eda100'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        Confronto Fotovoltaico
      </a>
      <span class="badge hidden" id="mode-badge" title="I dati inseriti restano solo in questo browser">Modalità locale</span>
      <nav>
        <a href="index.html" aria-current="page">Dashboard</a>
        <a href="dati.html">Dati</a>
        <a href="inserisci.html">Inserisci</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="filters" role="group" aria-label="Periodo e impianti">
      <label class="field">Anno <select id="year"></select></label>
      <label class="field">Trimestre
        <select id="quarter">
          <option value="all">Tutto l'anno</option>
          <option value="1">T1 · gen–mar</option>
          <option value="2">T2 · apr–giu</option>
          <option value="3">T3 · lug–set</option>
          <option value="4">T4 · ott–dic</option>
          <option value="custom" hidden>Personalizzato</option>
        </select>
      </label>
      <div id="ms-months"></div>
      <div id="ms-plants"></div>
    </div>

    <section class="card">
      <div class="card-head">
        <div>
          <h2 id="rank-title">Classifica</h2>
          <p class="sub">Ordinata per indice di rendimento: 100 = in linea con la mediana di tutti gli impianti nello stesso mese</p>
        </div>
      </div>
      <div class="table-wrap plain"><table class="data rank" id="ranking"></table></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2 id="chart-title">Grafico</h2>
          <p class="sub" id="chart-sub"></p>
        </div>
        <span class="spacer"></span>
        <div class="controls">
          <label class="field">Grafico
            <select id="chart-type">
              <option value="monthly">Andamento mensile</option>
              <option value="yoy">Anno su anno</option>
              <option value="cum">Cumulato anno su anno</option>
              <option value="rank">Classifica</option>
              <option value="heat">Mese per mese</option>
            </select>
          </label>
          <label class="field">Unità <select id="chart-unit"></select></label>
          <label class="field hidden" id="yoy-plant-field">Impianto <select id="yoy-plant"></select></label>
        </div>
      </div>
      <div id="chart-area"></div>
      <div class="legend" id="chart-legend"></div>
    </section>
  </main>

  <footer>
    <span id="footer-info"></span>
    <button class="link hidden" id="reset-local" type="button">Ripristina i dati originali (solo modalità locale)</button>
  </footer>

  <div class="tip" id="tip" role="tooltip"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>

# Supabase (piano gratuito) mette in pausa il progetto dopo circa una settimana
# senza attività. Questo job interroga il database ogni 2 giorni per tenerlo sveglio.
name: Tieni sveglio Supabase

on:
  schedule:
    - cron: "17 6 */2 * *"   # ogni 2 giorni alle 6:17 UTC
  workflow_dispatch:          # avvio manuale dalla tab Actions

permissions:
  actions: write   # serve solo per riattivare questo workflow (vedi ultimo step)
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroga il database
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' js/config.js)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' js/config.js)
          for i in 1 2 3; do
            code=$(curl -s -o out.json -w '%{http_code}' -m 30 \
              "$URL/rest/v1/readings?select=year&limit=1" -H "apikey: $KEY")
            echo "tentativo $i: HTTP $code $(cat out.json)"
            [ "$code" = 200 ] && exit 0
            sleep 20
          done
          echo "::error::Supabase non risponde: probabilmente è in pausa, riattivalo dalla dashboard"
          exit 1
      - name: Evita che GitHub disattivi il workflow dopo 60 giorni senza commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"

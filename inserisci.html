<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inserisci Produzione</title>
  <meta name="description" content="Inserisci o modifica la produzione mensile del tuo impianto">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='5' fill='%23eda100'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        Confronto Fotovoltaico
      </a>
      <span class="badge hidden" id="mode-badge" title="I dati inseriti restano solo in questo browser">Modalità locale</span>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="inserisci.html" aria-current="page">Inserisci</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Inserisci la produzione</h1>
    <p class="lede">Un valore al mese per impianto. Se il mese c'è già, il valore viene sovrascritto.</p>

    <section class="card form-card">
      <form id="form" class="form-grid" autocomplete="off" novalidate>
        <label class="f full">Impianto
          <select id="plant" required></select>
        </label>
        <label class="f">Anno
          <input type="number" id="year" min="2000" max="2100" step="1" required inputmode="numeric">
        </label>
        <label class="f">Mese
          <select id="month" required></select>
        </label>
        <label class="f">Produzione (kWh)
          <input type="number" id="kwh" min="0" step="0.1" required inputmode="decimal" placeholder="es. 812">
        </label>
        <label class="f">Potenza impianto (kWp)
          <input type="number" id="kwp" min="0.01" step="0.01" required inputmode="decimal">
          <span class="hint">Precompilata con l'ultimo valore. Cambiala solo se hai ampliato l'impianto.</span>
        </label>
        <label class="f">Giorni conteggiati
          <input type="number" id="days" min="1" max="31" step="1" required inputmode="numeric">
          <span class="hint">Meno del mese intero se l'impianto è partito o si è fermato a metà mese.</span>
        </label>
        <label class="f">PIN dell'impianto
          <input type="password" id="pin" required inputmode="numeric" autocomplete="current-password">
          <label class="check"><input type="checkbox" id="remember"> ricorda su questo dispositivo</label>
        </label>

        <div class="calc full" aria-live="polite">
          <span>Resa: <b id="c-spec">–</b> kWh/kWp</span>
          <span>Media giornaliera: <b id="c-day">–</b> kWh/kWp</span>
          <span id="c-prev"></span>
        </div>

        <div class="notice info full" id="existing"></div>
        <div class="notice full" id="msg" role="status"></div>

        <div class="actions full">
          <button class="btn primary" type="submit" id="save">Salva</button>
          <button class="btn danger hidden" type="button" id="delete">Elimina questo mese</button>
        </div>
      </form>

      <details>
        <summary>Cambia PIN</summary>
        <form id="pin-form" class="form-grid" style="margin-top:12px" autocomplete="off">
          <label class="f">PIN attuale <input type="password" id="old-pin" inputmode="numeric" autocomplete="current-password"></label>
          <label class="f">Nuovo PIN (4–8 cifre) <input type="password" id="new-pin" inputmode="numeric" autocomplete="new-password"></label>
          <div class="notice full" id="pin-msg" role="status"></div>
          <div class="actions full"><button class="btn" type="submit">Cambia PIN</button></div>
        </form>
      </details>
    </section>

    <section class="card history">
      <div class="card-head">
        <div>
          <h2 id="hist-title">Ultime letture</h2>
          <p class="sub">Clicca una riga per modificarla</p>
        </div>
      </div>
      <div class="table-wrap"><table class="data" id="hist"></table></div>
    </section>
  </main>

  <script type="module" src="js/inserisci.js"></script>
</body>
</html>
